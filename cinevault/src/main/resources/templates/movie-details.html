<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title} + ' | CineVault'">Movie Details</title>

    <link rel="stylesheet" th:href="@{/css/movie-details.css}">
</head>
<body>

<nav class="navbar">
    <div class="logo">🎬 CineVault</div>

    <ul class="nav-links">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/movies}">Movies</a></li>
        <li><a th:href="@{/watchlist}">My Watchlist</a></li>
        <li><a th:href="@{/reviews}">My Reviews</a></li>
        <li><a th:href="@{/profile}">My Profile</a></li>
    </ul>
</nav>

<section class="movie-container">

    <div class="movie-card">

        <div class="poster-section">
            <img th:src="${movie.posterUrl != null && !movie.posterUrl.isEmpty()
                    ? movie.posterUrl
                    : '/images/default-poster.jpg'}"
                 alt="Movie Poster"
                 class="poster">
        </div>

        <div class="movie-info">

            <h1 th:text="${movie.title}">Movie Title</h1>

            <div class="movie-meta">
                <span>
                    🎭 <strong>Genre:</strong>
                    <span th:text="${movie.genre}">Genre</span>
                </span>

                <span>
                    📅 <strong>Year:</strong>
                    <span th:text="${movie.releaseYear}">2025</span>
                </span>

                <span>
                    🎬 <strong>Director:</strong>
                    <span th:text="${movie.director}">Director</span>
                </span>
            </div>

            <div class="rating-box">
                ⭐ Average Rating:
                <strong th:text="${averageRating}">0.0</strong>/10
            </div>

            <div class="description-box">
                <h3>Description</h3>

                <p th:text="${movie.description}">
                    Movie description...
                </p>
            </div>

            <a th:href="@{/movies}" class="btn">
                ← Back to Movies
            </a>

        </div>

    </div>

</section>

<section class="reviews-section">

    <h2>📝 Reviews</h2>

    <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
        No reviews yet.
    </div>

    <div th:each="review : ${reviews}" class="review-card">

        <div class="review-header">
            <strong th:text="${review.user.username}">
                Username
            </strong>

            <span>
                ⭐ <span th:text="${review.rating}">5</span>/10
            </span>
        </div>

        <p th:text="${review.comment}">
            Review text...
        </p>

    </div>

</section>

</body>
</html>
