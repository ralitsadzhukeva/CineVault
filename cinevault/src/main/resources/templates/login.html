<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CineVault</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="container">

    <div class="login-card">

        <h1>🎬 CineVault</h1>
        <h2>Welcome Back</h2>

        <form th:action="@{/login}"
              th:object="${userLoginDto}"
              method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       th:field="*{username}"
                       placeholder="Enter username">
                <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       th:field="*{password}"
                       placeholder="Enter password">
                <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div th:if="${param.logout}" class="success-message">
                You have been logged out successfully.
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a th:href="@{/register}">Register</a>
        </p>

    </div>

</div>

</body>
</html>
