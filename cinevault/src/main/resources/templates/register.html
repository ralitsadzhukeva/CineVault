<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CineVault</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="container">

    <div class="register-card">

        <h1>🎬 CineVault</h1>
        <h2>Create Account</h2>

        <form th:action="@{/register}"
              th:object="${userRegisterDto}"
              method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       th:field="*{username}"
                       placeholder="Enter username">
                <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter email">
                <p class="alert-warning" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       th:field="*{password}"
                       placeholder="Enter password">
                <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password"
                       th:field="*{confirmPassword}"
                       placeholder="Confirm password">
                <p class="alert-warning" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            </div>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
