<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Movie - CineVault</title>

    <link rel="stylesheet"
          th:href="@{/css/movie-edit.css}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎬 CineVault
    </div>

    <ul class="nav-links">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/movies}">Movies</a></li>
        <li><a th:href="@{/movies/manage}">Manage Movies</a></li>
        <li><a th:href="@{/profile}">Profile</a></li>
    </ul>

</nav>

<section class="page-header">

    <h1>✏️ Edit Movie</h1>

    <p>Update movie information.</p>

</section>

<section class="form-container">

    <form th:action="@{/movies/edit/{id}(id=${movieId})}"
          th:object="${movieEditDto}"
          method="post">

        <div class="form-group">

            <label for="title">
                Title
            </label>

            <input id="title"
                   type="text"
                   th:field="*{title}">

            <small class="error"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}">
            </small>

        </div>

        <div class="form-group">

            <label for="director">
                Director
            </label>

            <input id="director"
                   type="text"
                   th:field="*{director}">

            <small class="error"
                   th:if="${#fields.hasErrors('director')}"
                   th:errors="*{director}">
            </small>

        </div>

        <div class="form-group">

            <label for="genre">
                Genre
            </label>

            <select id="genre"
                    th:field="*{genre}">

                <option th:each="genre : ${genres}"
                        th:value="${genre}"
                        th:text="${genre}">
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="releaseYear">
                Release Year
            </label>

            <input id="releaseYear"
                   type="number"
                   th:field="*{releaseYear}">

            <small class="error"
                   th:if="${#fields.hasErrors('releaseYear')}"
                   th:errors="*{releaseYear}">
            </small>

        </div>

        <div class="form-group">

            <label for="posterUrl">
                Poster URL
            </label>

            <input id="posterUrl"
                   type="text"
                   th:field="*{posterUrl}">

        </div>

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea id="description"
                      rows="8"
                      th:field="*{description}">
            </textarea>

            <small class="error"
                   th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}">
            </small>

        </div>

        <div class="actions">

            <button type="submit"
                    class="btn">
                Save Changes
            </button>

            <a th:href="@{/movies/manage}"
               class="btn secondary">
                Cancel
            </a>

        </div>

    </form>

</section>

</body>
</html>
