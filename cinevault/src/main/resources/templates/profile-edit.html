<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | CineVault</title>

    <link rel="stylesheet" th:href="@{/css/profile-edit.css}">
</head>
<body>

<div class="container">

    <div class="edit-card">

        <h1>🎬 CineVault</h1>
        <h2>Edit Profile</h2>

        <form th:action="@{/profile/edit}"
              th:object="${userEditDto}"
              method="post">

            <div class="form-group">
                <label>First Name</label>
                <input type="text"
                       th:field="*{firstName}"
                       placeholder="Enter first name">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text"
                       th:field="*{lastName}"
                       placeholder="Enter last name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter email">
            </div>

            <button type="submit" class="btn">
                Save Changes
            </button>

        </form>

        <div class="back-link">
            <a th:href="@{/profile}">
                ← Back to Profile
            </a>
        </div>

    </div>

</div>

</body>
</html>
