<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="https://www.thymeleaf.org/extras/spring-security"><head>
    <meta charset="UTF-8">
    <title>Movies - CineVault</title>
    <link rel="stylesheet" th:href="@{/css/movies.css}">
</head>
<body>

<nav class="navbar">
    <div class="logo">🎬 CineVault</div>
    <ul class="nav-links">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/movies}">Movies</a></li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/watchlist}">My Watchlist</a>
        </li>        <li><a th:href="@{/reviews}">My Reviews</a></li>
        <li><a th:href="@{/profile}">My Profile</a></li>
    </ul>
</nav>

<section class="page-header">
    <h1>🎥 Movies</h1>
    <p>Explore new movies!</p>
    <form th:action="@{/movies}" method="get" class="search-form">

        <input type="text"
               name="search"
               th:value="${search}"
               placeholder="Search movies...">

        <button type="submit">
            Search
        </button>

    </form>
</section>

<section class="movies-grid">
    <div th:if="${#lists.isEmpty(movies)}" class="no-results">
        No movies found.
    </div>
    <div class="movie-card" th:each="movie : ${movies}">
        <img th:src="${movie.posterUrl != null && !movie.posterUrl.isEmpty()
              ? movie.posterUrl
              : '/images/default-poster.jpg'}"
             alt="Poster"
             class="poster">
        <div class="movie-info">
            <h2 th:text="${movie.title}">Movie Title</h2>

            <p class="meta">
                <span th:text="${movie.genre}">Genre</span> •
                <span th:text="${movie.releaseYear}">2024</span>
            </p>

            <p class="description" th:text="${movie.description}">
                Movie description goes here...
            </p>

            <div class="actions">
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/watchlist/add/{id}(id=${movie.id})}" class="btn">
                        Add to Watchlist
                    </a>
                </div>

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn">
                        Login to add to Watchlist
                    </a>
                </div>
                <a th:href="@{/movies/{id}(id=${movie.id})}" class="btn small">
                    Details
                </a>
            </div>

        </div>
    </div>

</section>

</body>
</html>
